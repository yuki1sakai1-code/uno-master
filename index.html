<!DOCTYPE html>
<html lang="ja" data-theme="akiba-98">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <div class="theme-bg" aria-hidden="true"></div>

  <!-- Title Screen -->
  <div id="title-screen" class="screen active">
    <div class="title-content">
      <h1 class="game-title">UNO 2.0</h1>
      <p class="tagline">世界で一番UNOが好き</p>
      <button id="start-btn" class="start-btn">
        <span class="play-icon">▶</span>
        GAME START
      </button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <!-- Cyber Perspective Table & Field (ゲーム中のみ表示) -->
    <div class="cyber-mesh-grid"></div>
    <div class="cyber-table-container">
      <svg class="cyber-table-svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="cyberTableFill" x1="0" y1="0" x2="0" y2="1">
            <stop id="stop-table-top" offset="0%" stop-color="#0f2548"/>
            <stop id="stop-table-mid1" offset="35%" stop-color="#091932"/>
            <stop id="stop-table-mid2" offset="70%" stop-color="#061225"/>
            <stop id="stop-table-bot" offset="100%" stop-color="#040b18"/>
          </linearGradient>

          <radialGradient id="cyberTableGlow" cx="50%" cy="50%" r="50%">
            <stop id="stop-glow-core" offset="0%" stop-color="#00aaff" stop-opacity="0.25"/>
            <stop id="stop-glow-mid" offset="35%" stop-color="#0066cc" stop-opacity="0.1"/>
            <stop id="stop-glow-outer" offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>

          <filter id="tableBorderGlow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow id="fe-shadow-1" dx="0" dy="0" stdDeviation="4" flood-color="#00d4ff" flood-opacity="0.75"/>
            <feDropShadow id="fe-shadow-2" dx="0" dy="0" stdDeviation="12" flood-color="#0099ff" flood-opacity="0.3"/>
          </filter>

          <filter id="slotGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow id="fe-slot-shadow" dx="0" dy="0" stdDeviation="2.5" flood-color="#00d4ff" flood-opacity="0.4"/>
          </filter>
        </defs>

        <!-- 3D Perspective Table Board -->
        <path class="table-outer-base" d="M 240,55 L 960,55 Q 972,55 980,62 L 1035,112 Q 1042,120 1045,130 L 1105,595 Q 1108,615 1088,615 L 112,615 Q 92,615 95,595 L 155,130 Q 158,120 165,112 L 220,62 Q 228,55 240,55 Z" fill="url(#cyberTableFill)" stroke="var(--table-stroke, #00c8ff)" stroke-width="2" filter="url(#tableBorderGlow)"/>

        <!-- Center Radial Highlight on Table -->
        <ellipse cx="600" cy="350" rx="440" ry="250" fill="url(#cyberTableGlow)"/>

        <!-- Inset Tech Border Line -->
        <path class="table-inner-line" d="M 252,72 L 948,72 Q 958,72 965,78 L 1018,126 Q 1024,132 1026,140 L 1084,582 Q 1086,598 1070,598 L 130,598 Q 114,598 116,582 L 174,140 Q 176,132 182,126 L 235,78 Q 242,72 252,72 Z" fill="none" stroke="var(--table-inner-line, #00c8ff)" stroke-width="1.2" stroke-opacity="0.45"/>

        <!-- Top & Corner Tech HUD Accents -->
        <line class="table-hud-accent" x1="720" y1="72" x2="800" y2="72" stroke="var(--table-accent, #00c8ff)" stroke-width="2" stroke-dasharray="10 4 4 4 4 4" stroke-opacity="0.85"/>
        <line class="table-hud-line" x1="215" y1="120" x2="260" y2="80" stroke="var(--table-inner-line, #00c8ff)" stroke-width="1.5" stroke-opacity="0.5"/>
        <line class="table-hud-line" x1="203" y1="130" x2="248" y2="90" stroke="var(--table-inner-line, #00c8ff)" stroke-width="1" stroke-opacity="0.3"/>
        <line class="table-hud-line" x1="985" y1="120" x2="940" y2="80" stroke="var(--table-inner-line, #00c8ff)" stroke-width="1.5" stroke-opacity="0.5"/>
        <line class="table-hud-line" x1="997" y1="130" x2="952" y2="90" stroke="var(--table-inner-line, #00c8ff)" stroke-width="1" stroke-opacity="0.3"/>
        <line class="table-hud-line" x1="145" y1="565" x2="195" y2="565" stroke="var(--table-inner-line, #00c8ff)" stroke-width="1.2" stroke-opacity="0.35"/>
        <line class="table-hud-line" x1="1055" y1="565" x2="1005" y2="565" stroke="var(--table-inner-line, #00c8ff)" stroke-width="1.2" stroke-opacity="0.35"/>

        <!-- Concentric Perspective Radar Rings -->
        <ellipse class="table-radar-ring" cx="600" cy="350" rx="350" ry="200" fill="none" stroke="var(--table-radar, #00c8ff)" stroke-width="1.2" stroke-opacity="0.22" stroke-dasharray="14 8"/>
        <ellipse class="table-radar-ring" cx="600" cy="350" rx="220" ry="125" fill="none" stroke="var(--table-radar, #00c8ff)" stroke-width="1" stroke-opacity="0.25"/>
        <ellipse class="table-radar-ring" cx="600" cy="350" rx="95" ry="55" fill="none" stroke="var(--table-radar, #00c8ff)" stroke-width="1" stroke-opacity="0.18"/>

        <!-- Horizontal Guide / Alignment Lines -->
        <line class="table-guide-line" x1="60" y1="350" x2="340" y2="350" stroke="var(--table-guide, #00c8ff)" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.45"/>
        <line class="table-guide-line" x1="860" y1="350" x2="1140" y2="350" stroke="var(--table-guide, #00c8ff)" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.45"/>
        <line class="table-guide-line" x1="510" y1="125" x2="690" y2="125" stroke="var(--table-guide, #00c8ff)" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4"/>

        <!-- 4 Card Placement Slots (Ghost Cards) -->
        <rect class="table-slot" x="340" y="282" width="92" height="136" rx="8" fill="none" stroke="var(--table-slot-stroke, #00c8ff)" stroke-width="1.5" stroke-opacity="0.3" filter="url(#slotGlow)"/>
        <rect class="table-slot" x="490" y="282" width="92" height="136" rx="8" fill="none" stroke="var(--table-slot-stroke, #00c8ff)" stroke-width="1.5" stroke-opacity="0.4" filter="url(#slotGlow)"/>
        <rect class="table-slot" x="618" y="282" width="92" height="136" rx="8" fill="none" stroke="var(--table-slot-stroke, #00c8ff)" stroke-width="1.5" stroke-opacity="0.4" filter="url(#slotGlow)"/>
        <rect class="table-slot" x="768" y="282" width="92" height="136" rx="8" fill="none" stroke="var(--table-slot-stroke, #00c8ff)" stroke-width="1.5" stroke-opacity="0.3" filter="url(#slotGlow)"/>
      </svg>
    </div>
    <div class="game-hud">
      <div id="message-bar" class="message-bar"></div>
    </div>

    <!-- Turn direction indicator -->
    <div class="turn-ring" aria-hidden="true">
      <svg viewBox="0 0 200 200" class="turn-arrow">
        <path d="M100 20 A80 80 0 1 1 60 170" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
        <polygon points="55,175 45,160 65,165" fill="rgba(255,255,255,0.06)"/>
      </svg>
    </div>

    <!-- Opponents -->
    <div class="opponent opponent-left" data-player="1">
      <div class="thought-bubble" id="thought-1" aria-live="polite">
        <span class="thought-icon">💭</span>
        <span class="thought-text"></span>
      </div>
      <div class="opponent-avatar">
        <div class="avatar-crop">
          <img class="avatar-img" src="assets/avatars/jockey-a.png" alt="プレイヤーA">
        </div>
      </div>
      <div class="opponent-name">プレイヤーA</div>
      <div class="card-bar" id="bar-1"></div>
    </div>

    <div class="opponent opponent-top" data-player="2">
      <div class="thought-bubble" id="thought-2" aria-live="polite">
        <span class="thought-icon">💭</span>
        <span class="thought-text"></span>
      </div>
      <div class="opponent-avatar">
        <div class="avatar-crop">
          <img class="avatar-img" src="assets/avatars/jockey-b.png" alt="プレイヤーB">
        </div>
      </div>
      <div class="opponent-name">プレイヤーB</div>
      <div class="card-bar" id="bar-2"></div>
    </div>

    <div class="opponent opponent-right" data-player="3">
      <div class="thought-bubble" id="thought-3" aria-live="polite">
        <span class="thought-icon">💭</span>
        <span class="thought-text"></span>
      </div>
      <div class="opponent-avatar">
        <div class="avatar-crop">
          <img class="avatar-img" src="assets/avatars/jockey-c.png" alt="プレイヤーC">
        </div>
      </div>
      <div class="opponent-name">プレイヤーC</div>
      <div class="card-bar" id="bar-3"></div>
    </div>

    <!-- Center play area -->
    <div class="play-area">
      <div class="deck-area">
        <button id="draw-pile" class="card card-back" title="カードを引く">
          <div class="card-back-pattern" aria-hidden="true"></div>
          <span class="uno-logo">UNO</span>
        </button>
        <span id="deck-count" class="deck-count">0</span>
      </div>
      <div id="discard-pile" class="discard-area"></div>
    </div>

    <!-- Player hand -->
    <div class="player-area">
      <div class="player-label">あなた</div>
      <div id="player-hand" class="player-hand"></div>
      <div class="player-actions">
        <button id="uno-btn" class="action-btn uno-call" disabled>UNO!</button>
        <button id="pass-btn" class="action-btn" disabled>パス</button>
      </div>
    </div>

    <!-- Color picker modal -->
    <div id="color-modal" class="modal hidden">
      <div class="modal-content">
        <p>色を選んでください</p>
        <div class="color-picker">
          <button class="color-btn red" data-color="red"></button>
          <button class="color-btn green" data-color="green"></button>
          <button class="color-btn blue" data-color="blue"></button>
          <button class="color-btn yellow" data-color="yellow"></button>
        </div>
      </div>
    </div>

    <!-- Special card FX layer -->
    <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

    <!-- Result modal -->
    <div id="result-modal" class="modal hidden">
      <div class="modal-content result-content">
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <button id="restart-btn" class="start-btn small">
          <span class="play-icon">▶</span>
          もう一度
        </button>
      </div>
    </div>
  </div>

  <!-- Theme Menu -->
  <aside id="theme-menu" class="theme-menu" aria-label="デザインプレビュー">
    <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="テーマ切替">
      <span class="theme-toggle-icon">🎨</span>
      <span class="theme-current-label">Akiba '98</span>
      <span class="theme-chevron">▾</span>
    </button>
    <div class="theme-dropdown-content">
      <div class="theme-menu-label">DESIGN PREVIEW MODE</div>
      <nav class="theme-list">
        <button class="theme-btn" data-theme="neon-tokyo">
          <span class="theme-icon" aria-hidden="true"></span>
          Neon Tokyo
        </button>
        <button class="theme-btn" data-theme="kyoto-zen">
          <span class="theme-icon" aria-hidden="true"></span>
          Kyoto Zen
        </button>
        <button class="theme-btn active" data-theme="akiba-98">
          <span class="theme-icon" aria-hidden="true"></span>
          Akiba '98
        </button>
        <button class="theme-btn" data-theme="shimokita-lofi">
          <span class="theme-icon" aria-hidden="true"></span>
          Shimokita Lo-Fi
        </button>
        <button class="theme-btn" data-theme="roppongi-void">
          <span class="theme-icon" aria-hidden="true"></span>
          Roppongi Void
        </button>
      </nav>
    </div>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
